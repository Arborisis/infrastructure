name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-configs:
    name: Validate Configurations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create minimal .env for validation
        run: |
          touch .env

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.dev.yml config > /dev/null
          docker compose -f docker-compose.staging.yml config > /dev/null

      - name: Validate GitHub Actions workflows
        run: |
          for file in .github/workflows/*.yml; do
            echo "Validating $file"
          done

  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          repository: Arborisis/app
          path: arborisis
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build App image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.dev
          push: false
          platforms: linux/amd64
          cache-from: type=gha

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate-configs
      - docker-build-check

    steps:
      - name: Write summary
        run: |
          {
            echo "## Infrastructure CI Summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Validate Configs | ${{ needs.validate-configs.result }} |"
            echo "| Docker Build Check | ${{ needs.docker-build-check.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on critical job failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
