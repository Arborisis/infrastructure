upstream audio_cluster {
    least_conn;
    
    server audio-services.railway.internal:8080;
    server audio-worker-1.railway.internal:8080;
    server audio-worker-2.railway.internal:8080;
    
    keepalive 32;
}

server {
    listen 80;
    
    location / {
        proxy_pass http://audio_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Healthcheck endpoint
        location /health {
            proxy_pass http://audio_cluster/health;
            access_log off;
        }
    }
    
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}
